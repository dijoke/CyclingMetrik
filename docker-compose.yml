name: cyclingmetrik

services:
  db:
    image: postgres:16-alpine
    container_name: coaching-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
